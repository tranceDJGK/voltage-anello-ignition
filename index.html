<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VOLTAGE · Anello</title>
    <meta
      name="description"
      content="Mainstage trance a 360°: pedana circolare, quattro fronti Ignition, anello luci autoportante."
    />
    <meta name="theme-color" content="#07080c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07080c;
        --fg: #f3efe6;
        --muted: #9a958c;
        --line: #2c2e36;
        --ice: #8ee7ff;
        --crimson: #ff2d4a;
        --panel: rgb(8 10 14 / 0.78);
        --solid: #101218;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body { overflow: hidden; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
      button { font: inherit; color: inherit; background: none; cursor: pointer; }
      button:focus-visible { outline: 1px solid var(--ice); outline-offset: 2px; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
      .vignette {
        pointer-events: none;
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 42%, rgb(5 6 10 / 0.62) 100%);
      }
      header, footer { position: absolute; left: 0; right: 0; display: flex; gap: 12px; }
      header { top: 0; justify-content: space-between; align-items: flex-start; padding: 16px 20px; pointer-events: none; }
      footer { bottom: 0; flex-direction: column; padding: 12px 16px 16px; }
      .brand {
        font-family: Oswald, sans-serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 500;
        margin: 0;
      }
      .sub, .meta, .hint { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
      .right { text-align: right; }
      .meter { margin-left: auto; margin-top: 8px; height: 4px; width: 96px; background: var(--line); overflow: hidden; }
      .meter > span { display: block; height: 100%; width: 100%; background: var(--ice); transform: scaleX(0.2); transform-origin: left; }
      .row, .chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .chips { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
      .chips::-webkit-scrollbar { display: none; }
      .chip, .play {
        min-height: 44px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--muted);
        padding: 0 12px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        flex: 0 0 auto;
      }
      .chip[aria-pressed="true"] { border-color: var(--ice); color: var(--fg); background: var(--solid); }
      .look[aria-pressed="true"] { border-color: var(--crimson); }
      .play { border-color: var(--crimson); color: var(--fg); }
      .mark { width: 36px; height: 36px; flex: 0 0 auto; }
      .ident { display: flex; gap: 12px; align-items: center; pointer-events: auto; }
      .stick {
        display: none;
        position: absolute;
        left: 16px;
        bottom: 176px;
        width: 112px;
        height: 112px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        touch-action: none;
        align-items: center;
        justify-content: center;
      }
      .stick.on { display: flex; }
      .knob { width: 48px; height: 48px; border-radius: 999px; border: 1px solid var(--ice); background: var(--solid); }
      @media (min-width: 800px) {
        .wide { display: inline; }
        header { padding: 24px; }
      }
      @media (max-width: 799px) {
        .wide { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Palco circolare VOLTAGE Anello"></canvas>
    <div class="vignette"></div>
    <header>
      <div class="ident">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <circle cx="18" cy="18" r="16.5" fill="none" stroke="#8ee7ff" stroke-width="1.25"></circle>
          <path d="M10 11 L18 26 L26 11" fill="none" stroke="#f3efe6" stroke-width="1.6"></path>
          <path d="M8 18 H28" stroke="#ff2d4a" stroke-width="1.2"></path>
        </svg>
        <div>
          <p class="brand">Voltage</p>
          <p class="sub">Anello · quattro fronti Ignition</p>
        </div>
      </div>
      <div class="right">
        <p class="meta">CONCEPT VISIVO</p>
        <p class="sub wide">Pedana Ø 8,0 m · anello h 6,5 m</p>
        <div class="meter"><span id="meter"></span></div>
      </div>
    </header>
    <footer>
      <div class="row">
        <div class="row" id="modes"></div>
        <button class="play" id="play" type="button">Accendi il click</button>
        <p class="sub wide">138 BPM · sequenza di regia, non un brano</p>
      </div>
      <div class="chips" id="shots"></div>
      <div class="chips" id="looks"></div>
      <div class="row" style="justify-content: space-between">
        <p class="hint" id="hint">Trascina per orbitare · scroll per entrare nel palco</p>
        <p class="hint" id="crowd">Accensione</p>
      </div>
    </footer>
    <div class="stick" id="stick" aria-label="Joystick"><div class="knob" id="knob"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
